# Gruvbox — retro groove, derived from base16 gruvbox-dark-hard
# (https://github.com/tinted-theming/schemes).
name = "Gruvbox"

# Map surfaces
ocean = "#1d2021"           # base00
land = "#3c3836"            # base01
border = "#665c54"          # base03
grid = "#ffffff30"
grid_label = "#bdae93"      # base04
gmt = "#b8bb2634"           # base0B green
idl = "#fb4934"             # base08 red
column = "#ffffff14"

# Day/night overlay
night = "#0c0d0d"
day_wash = "#d5c4a112"      # warm wash
night_alpha = 12

# Clocks
text = "#ebdbb2"            # base06
text_stroke = "#0e1010dc"
dot = "#d5c4a1"             # base05
dot_outline = "#0e1010d2"
home = "#fabd2f"            # base0A yellow
home_stroke = "#1e1800dc"

# Optional extras
logo = "#ebdbb2"
