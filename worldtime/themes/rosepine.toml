# Rosé Pine — all natural pine, faux fur and a bit of soho vibes, derived from
# base16 rose-pine (https://github.com/tinted-theming/schemes).
name = "Rosé Pine"

# Map surfaces
ocean = "#191724"           # base
land = "#26233a"            # overlay (surface is too close to base for legible landmasses)
border = "#6e6a86"          # muted
grid = "#ffffff30"
grid_label = "#908caa"      # subtle
gmt = "#31748f34"           # pine
idl = "#eb6f92"             # love
column = "#ffffff14"

# Day/night overlay
night = "#0a0910"
day_wash = "#9ccfd812"      # foam wash
night_alpha = 12

# Clocks
text = "#e0def4"            # text
text_stroke = "#100e17dc"
dot = "#9ccfd8"             # foam
dot_outline = "#100e17d2"
home = "#f6c177"            # gold
home_stroke = "#1e1800dc"

# Optional extras
logo = "#e0def4"
