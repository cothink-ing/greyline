# Catppuccin — soothing pastel, derived from base16 catppuccin-mocha
# (https://github.com/tinted-theming/schemes).
name = "Catppuccin Mocha"

# Map surfaces
ocean = "#1e1e2e"           # base
land = "#313244"            # surface0
border = "#6c7086"          # overlay0
grid = "#ffffff30"
grid_label = "#a6adc8"      # subtext0
gmt = "#a6e3a134"           # green
idl = "#f38ba8"             # red
column = "#ffffff14"

# Day/night overlay
night = "#0c0c14"
day_wash = "#b4befe12"      # lavender wash
night_alpha = 12

# Clocks
text = "#cdd6f4"            # text
text_stroke = "#11111bdc"   # crust
dot = "#b4befe"             # lavender
dot_outline = "#11111bd2"
home = "#cba6f7"            # mauve — the signature accent
home_stroke = "#11111bdc"

# Optional extras
logo = "#cdd6f4"
