# Regenerate with tools/base16_to_theme.py; edit that, not this file.
name = "Tokyo Night Storm"

# Map surfaces
ocean = "#24283b"          # base00
land = "#3c425e"           # landmasses
border = "#444b6a"         # base03
grid = "#ffffff30"         # timezone boundary lines
grid_label = "#787c99"     # base04
gmt = "#9ece6a34"          # base0B, green UTC+0 column
idl = "#f7768e"            # base0F, red International Date Line
column = "#ffffff14"       # home timezone-column highlight

# Day/night overlay
night = "#0e1018"          # base00, darkened
day_wash = "#a9b1d612"     # base05
night_alpha = 12

# Clocks
text = "#cbccd1"           # base06
text_stroke = "#10121bdc"
dot = "#a9b1d6"            # base05
dot_outline = "#10121bd2"
home = "#2ac3de"           # base0D, the accent
home_stroke = "#10121bdc"

# Optional extras
logo = "#cbccd1"           # tint for logo_invert
