# Tokyo Night — neon-on-navy, derived from base16 tokyo-night-dark
# (https://github.com/tinted-theming/schemes).
name = "Tokyo Night"

# Map surfaces
ocean = "#16161e"           # base01 (darker than base00 in this scheme)
land = "#2f3549"            # base02
border = "#444b6a"          # base03
grid = "#ffffff30"
grid_label = "#787c99"      # base04
gmt = "#9ece6a34"           # base0B green
idl = "#f7768e"             # base0F red
column = "#ffffff14"

# Day/night overlay
night = "#0a0a11"
day_wash = "#a9b1d612"
night_alpha = 12

# Clocks
text = "#a9b1d6"            # base05
text_stroke = "#101019dc"
dot = "#a9b1d6"
dot_outline = "#101019d2"
home = "#2ac3de"            # base0D cyan
home_stroke = "#101019dc"

# Optional extras
logo = "#a9b1d6"
