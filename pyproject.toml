[build-system]
requires = ["setuptools>=77"]       # PEP 639 SPDX license fields
build-backend = "setuptools.build_meta"

[project]
name = "greyline"
version = "0.8.3"
description = "A live, multi-timezone world-time desktop wallpaper for Wayland/X11."
readme = "README.md"
requires-python = ">=3.11"          # tomllib + zoneinfo (stdlib)
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jotham Lim Ee Chen" }]
keywords = ["wallpaper", "wayland", "sway", "hyprland", "timezone", "terminator", "greyline"]
# tzdata: Windows has no system IANA tz database, so stdlib zoneinfo needs the PyPI
# package there. Unix (Linux/macOS) ships tzdata system-wide, so it's not pulled in.
dependencies = ["pillow>=9", "tomlkit>=0.11", "tzdata; platform_system == 'Windows'"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    # Windows/macOS support is beta and untested on real hardware (see README).
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Graphics",
]

[project.scripts]
greyline = "worldtime.__main__:main"

[project.urls]
Homepage = "https://github.com/cothink-ing/greyline"
Repository = "https://github.com/cothink-ing/greyline"
Documentation = "https://github.com/cothink-ing/greyline/wiki"
Issues = "https://github.com/cothink-ing/greyline/issues"
Changelog = "https://github.com/cothink-ing/greyline/blob/main/CHANGELOG.md"
Demo = "https://cothink-ing.github.io/greyline/"

[project.optional-dependencies]
test = ["pytest"]
dev = ["greyline[test]", "ruff", "mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# reference/ is one-off calibration scratch; dist/ is build output; web/ is the JS demo port.
extend-exclude = ["reference", "dist", "web"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
# U+2212 MINUS SIGN is used deliberately in prose comments (e.g. "−90", "+180/−180").
allowed-confusables = ["−"]

[tool.mypy]
python_version = "3.11"
files = ["worldtime", "tests", "tools"]
# The codebase is largely unannotated; still type-check function bodies.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true

[tool.setuptools]
packages = ["worldtime", "worldtime.backends"]

[tool.setuptools.package-data]
# Explicit list (not assets/*.png) so locally-present IBM/Lenovo artwork is never packaged.
worldtime = ["assets/tux.png", "default-config.toml", "geodata/*.geojson", "themes/*.toml"]
